<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="문이라고 쓰려는데 무라고 썼어요">
  <rect width="400" height="300" fill="#fbf7ee"/>
  <!-- 종이 -->
  <rect x="70" y="44" width="260" height="196" rx="8" fill="#fff" stroke="#d8d3c4" stroke-width="4"/>
  <path d="M70 92h260M70 140h260M70 188h260" stroke="#eae5d6" stroke-width="3"/>
  <text x="200" y="176" font-family="sans-serif" font-size="104" font-weight="900" fill="#2b3a67" text-anchor="middle">무</text>
  <!-- 빠진 받침 자리 -->
  <rect x="164" y="182" width="72" height="44" rx="8" fill="none" stroke="#e75757" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="272" y="122" font-family="sans-serif" font-size="46" font-weight="900" fill="#e75757">?</text>
  <!-- 연필 -->
  <g transform="rotate(38 320 214)">
    <rect x="308" y="150" width="20" height="76" fill="#ffd66b" stroke="#e0a92e" stroke-width="3"/>
    <path d="M308 226h20l-10 22z" fill="#f0c07a"/>
    <path d="M313 240h10l-5 8z" fill="#3b2a17"/>
  </g>
  <text x="200" y="278" font-family="sans-serif" font-size="19" font-weight="700" fill="#8a5a2a" text-anchor="middle">어? 이건 '무' 잖아! 받침이 없어요</text>
</svg>
