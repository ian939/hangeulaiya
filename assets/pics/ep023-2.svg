<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="커다란 돋보기가 있으면 같이 볼 수 있을 텐데">
  <rect width="400" height="300" fill="#fdf6e6"/>
  <!-- 작은 돋보기 -->
  <g transform="rotate(-20 118 150)">
    <circle cx="118" cy="150" r="40" fill="#dff0fb" stroke="#5a648a" stroke-width="7"/>
    <rect x="111" y="188" width="14" height="44" rx="7" fill="#8a5a2a"/>
  </g>
  <!-- 커다란 돋보기 (점선 = 아직 없음) -->
  <g transform="rotate(-12 268 142)">
    <circle cx="268" cy="142" r="82" fill="none" stroke="#e0a92e" stroke-width="8" stroke-dasharray="16 12"/>
    <rect x="256" y="220" width="24" height="60" rx="12" fill="none" stroke="#e0a92e" stroke-width="7" stroke-dasharray="12 9"/>
  </g>
  <text x="268" y="158" font-family="sans-serif" font-size="70" font-weight="900" fill="#e0a92e" text-anchor="middle">?</text>
  <path d="M170 146h34m0 0-10-10m10 10-10 10" stroke="#5a648a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="200" y="288" font-family="sans-serif" font-size="19" font-weight="700" fill="#7a5a2a" text-anchor="middle">커다란 돋보기가 있으면 같이 볼 텐데…</text>
</svg>
