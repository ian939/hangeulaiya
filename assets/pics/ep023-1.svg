<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="돋보기로 크게 보기 놀이">
  <rect width="400" height="300" fill="#eaf6f2"/>
  <!-- 돋보기 -->
  <g transform="rotate(-20 170 140)">
    <circle cx="170" cy="140" r="76" fill="#dff0fb" stroke="#5a648a" stroke-width="10"/>
    <circle cx="170" cy="140" r="76" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="158" y="212" width="26" height="76" rx="12" fill="#8a5a2a" stroke="#5a3a14" stroke-width="4"/>
  </g>
  <!-- 확대된 눈 -->
  <ellipse cx="170" cy="140" rx="52" ry="30" fill="#fff" stroke="#2b3a67" stroke-width="5"/>
  <circle cx="170" cy="140" r="20" fill="#4a6ea8"/>
  <circle cx="170" cy="140" r="9" fill="#1b2340"/>
  <circle cx="163" cy="133" r="4" fill="#fff"/>
  <!-- 작은 눈 (비교) -->
  <ellipse cx="322" cy="98" rx="20" ry="12" fill="#fff" stroke="#2b3a67" stroke-width="3"/>
  <circle cx="322" cy="98" r="7" fill="#4a6ea8"/>
  <path d="M300 130h44" stroke="#9aa4c0" stroke-width="4" stroke-linecap="round"/>
  <text x="322" y="152" font-family="sans-serif" font-size="15" font-weight="700" fill="#5a648a" text-anchor="middle">작아요</text>
  <text x="200" y="284" font-family="sans-serif" font-size="20" font-weight="700" fill="#2b3a67" text-anchor="middle">돋보기로 보면 크게 보여요</text>
</svg>
